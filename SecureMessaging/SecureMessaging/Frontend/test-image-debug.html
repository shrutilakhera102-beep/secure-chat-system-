<!DOCTYPE html>
<html>
<head>
    <title>Debug Image Upload</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #ffe0f0; }
        .test-area { border: 2px solid #ffb6c1; padding: 20px; margin: 20px 0; border-radius: 15px; background: white; }
        button { padding: 10px 20px; background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%); color: white; border: none; cursor: pointer; border-radius: 20px; margin: 10px; }
        .result { margin: 10px 0; padding: 15px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 10px; }
        .error { background: #ffe0e0; border-color: #ff6b6b; color: #d63384; }
        .success { background: #e0ffe0; border-color: #4caf50; color: #2e7d32; }
        input { padding: 10px; border: 2px solid #ffb6c1; border-radius: 20px; margin: 5px; }
        .debug-info { font-family: monospace; background: #f5f5f5; padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1 style="color: #d63384; text-align: center;">🌷 Debug Image Upload 🌷</h1>
    
    <div class="test-area">
        <h3 style="color: #d63384;">Step 1: Test Server Connection</h3>
        <button onclick="testConnection()">Test Connection to Server</button>
        <div id="connectionResult" class="result" style="display: none;"></div>
    </div>
    
    <div class="test-area">
        <h3 style="color: #d63384;">Step 2: Select Image</h3>
        <input type="file" id="imageInput" accept="image/*">
        <br><br>
        <div id="imageInfo" class="debug-info" style="display: none;"></div>
    </div>
    
    <div class="test-area">
        <h3 style="color: #d63384;">Step 3: Test Image Upload</h3>
        <label>Sender:</label> <input type="text" id="sender" value="testuser"><br><br>
        <label>Receiver:</label> <input type="text" id="receiver" value="testuser2"><br><br>
        <button onclick="testImageUpload()">Upload Image</button>
        <div id="uploadResult" class="result" style="display: none;"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8082';
        let selectedImage = null;

        // Test server connection
        async function testConnection() {
            const resultDiv = document.getElementById('connectionResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = 'Testing connection...';

            try {
                console.log('Testing connection to:', API_BASE);
                
                // Test a simple endpoint first
                const response = await fetch(`${API_BASE}/messages/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender: 'test',
                        receiver: 'test',
                        content: 'connection test'
                    })
                });
                
                console.log('Connection test response:', response);
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `<strong>✅ Server is running!</strong><br>Status: ${response.status}<br>Port: 8082`;
                } else {
                    const errorText = await response.text();
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<strong>❌ Server Error!</strong><br>Status: ${response.status}<br>Error: ${errorText}`;
                }
            } catch (error) {
                console.error('Connection error:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>❌ Connection Error!</strong><br>${error.message}<br><br>Possible causes:<br>• Server not running<br>• Wrong port<br>• CORS issues<br>• Network blocked`;
            }
        }

        // Image selection
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const infoDiv = document.getElementById('imageInfo');
            
            if (!file) {
                infoDiv.style.display = 'none';
                selectedImage = null;
                return;
            }
            
            console.log('Image selected:', file);
            
            selectedImage = file;
            infoDiv.style.display = 'block';
            infoDiv.innerHTML = `
                <strong>Image Info:</strong><br>
                Name: ${file.name}<br>
                Size: ${(file.size / 1024).toFixed(2)} KB<br>
                Type: ${file.type}<br>
                Last Modified: ${new Date(file.lastModified).toLocaleString()}
            `;
        });

        // Test image upload
        async function testImageUpload() {
            const fileInput = document.getElementById('imageInput');
            const file = fileInput.files[0];
            const sender = document.getElementById('sender').value;
            const receiver = document.getElementById('receiver').value;
            const resultDiv = document.getElementById('uploadResult');
            
            if (!file) {
                alert('Please select an image first');
                return;
            }
            
            if (!sender || !receiver) {
                alert('Please enter sender and receiver');
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = 'Uploading image...';

            try {
                console.log('Starting image upload...');
                console.log('FormData preparation...');
                
                const formData = new FormData();
                formData.append('sender', sender);
                formData.append('receiver', receiver);
                formData.append('image', file);

                console.log('Sending to:', `${API_BASE}/messages/send-image`);
                console.log('FormData contents:', {
                    sender: sender,
                    receiver: receiver,
                    image: file.name
                });

                const response = await fetch(`${API_BASE}/messages/send-image`, {
                    method: 'POST',
                    body: formData
                });

                console.log('Upload response:', response);

                if (response.ok) {
                    const result = await response.json();
                    console.log('Upload success:', result);
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ Image Upload Success!</strong><br>
                        Status: ${response.status}<br>
                        Message ID: ${result.id}<br>
                        Content Type: ${result.contentType}<br>
                        Timestamp: ${new Date(result.timestamp).toLocaleString()}
                    `;
                } else {
                    const errorText = await response.text();
                    console.error('Upload failed:', errorText);
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>❌ Upload Failed!</strong><br>
                        Status: ${response.status}<br>
                        Error: ${errorText}<br><br>
                        Common issues:<br>
                        • Image too large<br>
                        • Invalid image format<br>
                        • Server processing error
                    `;
                }
            } catch (error) {
                console.error('Network error:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <strong>❌ Network Error!</strong><br>
                    ${error.message}<br><br>
                    Check:<br>
                    • Server is running<br>
                    • No CORS issues<br>
                    • Network connectivity
                `;
            }
        }
    </script>
</body>
</html>
