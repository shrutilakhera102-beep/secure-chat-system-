<!DOCTYPE html>
<html>
<head>
    <title>Test Image Display</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #ffe0f0; }
        .test-section { border: 2px solid #ffb6c1; padding: 20px; margin: 20px 0; border-radius: 15px; background: white; }
        button { padding: 10px 20px; background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%); color: white; border: none; cursor: pointer; border-radius: 20px; margin: 10px; }
        .result { margin: 10px 0; padding: 15px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 10px; }
        .error { background: #ffe0e0; border-color: #ff6b6b; color: #d63384; }
        .success { background: #e0ffe0; border-color: #4caf50; color: #2e7d32; }
        .debug-info { font-family: monospace; background: #f5f5f5; padding: 10px; border-radius: 5px; margin: 10px 0; }
        img { max-width: 200px; border: 2px solid #ffb6c1; border-radius: 10px; margin: 10px 0; cursor: pointer; }
        img:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3); }
    </style>
</head>
<body>
    <h1 style="color: #d63384; text-align: center;">🌷 Test Image Display Debug 🌷</h1>
    
    <div class="test-section">
        <h3 style="color: #d63384;">Step 1: Test Server Connection</h3>
        <button onclick="testConnection()">Test Connection</button>
        <div id="connectionResult" class="result" style="display: none;"></div>
    </div>
    
    <div class="test-section">
        <h3 style="color: #d63384;">Step 2: Load Recent Messages</h3>
        <label>Sender:</label> <input type="text" id="sender" value="testuser"><br><br>
        <label>Receiver:</label> <input type="text" id="receiver" value="testuser2"><br><br>
        <button onclick="loadMessages()">Load Messages</button>
        <div id="messagesResult" class="result" style="display: none;"></div>
    </div>
    
    <div class="test-section">
        <h3 style="color: #d63384;">Step 3: Debug Info</h3>
        <div id="debugInfo" class="debug-info">Click "Load Messages" to see debug information...</div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8082';

        async function testConnection() {
            const resultDiv = document.getElementById('connectionResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = 'Testing connection...';

            try {
                const response = await fetch(`${API_BASE}/messages/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender: 'test',
                        receiver: 'test',
                        content: 'connection test'
                    })
                });
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = '✅ Server is running and responding!';
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `❌ Server error: ${response.status}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ Connection failed: ${error.message}`;
            }
        }

        async function loadMessages() {
            const sender = document.getElementById('sender').value;
            const receiver = document.getElementById('receiver').value;
            const resultDiv = document.getElementById('messagesResult');
            const debugDiv = document.getElementById('debugInfo');

            if (!sender || !receiver) {
                alert('Please enter both sender and receiver');
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = 'Loading messages...';

            try {
                const response = await fetch(`${API_BASE}/messages/chat?user1=${encodeURIComponent(sender)}&user2=${encodeURIComponent(receiver)}`);
                
                if (response.ok) {
                    const messages = await response.json();
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `✅ Found ${messages.length} messages`;
                    
                    // Debug information
                    let debugHTML = '<strong>🔍 Debug Information:</strong><br><br>';
                    
                    messages.forEach((msg, index) => {
                        debugHTML += `<strong>Message ${index + 1}:</strong><br>`;
                        debugHTML += `ID: ${msg.id}<br>`;
                        debugHTML += `Sender: ${msg.sender}<br>`;
                        debugHTML += `Receiver: ${msg.receiver}<br>`;
                        debugHTML += `Content Type: ${msg.contentType}<br>`;
                        debugHTML += `MIME Type: ${msg.mimeType || 'NOT SET'}<br>`;
                        debugHTML += `Content Length: ${msg.content ? msg.content.length : 0} characters<br>`;
                        debugHTML += `Has HMAC: ${msg.hmac ? 'YES' : 'NO'}<br>`;
                        debugHTML += `Has Nonce: ${msg.nonce ? 'YES' : 'NO'}<br>`;
                        
                        if (msg.contentType === 'IMAGE') {
                            debugHTML += `<br><strong>🖼️ Image Test:</strong><br>`;
                            
                            // Test different MIME types
                            const testFormats = [
                                { mime: msg.mimeType, label: 'Original MIME' },
                                { mime: 'image/jpeg', label: 'JPEG' },
                                { mime: 'image/png', label: 'PNG' },
                                { mime: 'image/gif', label: 'GIF' }
                            ];
                            
                            testFormats.forEach(format => {
                                const testSrc = `data:${format.mime};base64,${msg.content}`;
                                debugHTML += `<br><strong>${format.label}:</strong><br>`;
                                debugHTML += `<img src="${testSrc}" onerror="this.style.border='2px solid red'; this.title='FAILED: ${format.mime}';" onload="this.style.border='2px solid green'; this.title='SUCCESS: ${format.mime}';" />`;
                            });
                        }
                        
                        debugHTML += '<br><hr><br>';
                    });
                    
                    debugDiv.innerHTML = debugHTML;
                    
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `❌ Failed to load messages: ${response.status}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ Network error: ${error.message}`;
                debugDiv.innerHTML = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
