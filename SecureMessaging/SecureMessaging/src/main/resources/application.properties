spring.application.name=SecureMessaging
server.port=8082

# ── Database ──────────────────────────────────────────────────────────────────
# Override these with environment variables in production:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/secure_chat}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:shruti@123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── File Upload ────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── JWT ────────────────────────────────────────────────────────────────────────
# Override with a strong random secret in production: JWT_SECRET env var
# Must be at least 256 bits (32 chars) for HS256
jwt.secret=${JWT_SECRET:S3cur3Ch@tS3cr3tK3yF0rJWT2024!!XY}
jwt.expiration.ms=86400000
