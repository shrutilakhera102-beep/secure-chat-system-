<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureChat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="chat-body">
<div class="app-shell">

    <!-- ══════════════════════════════════════════════════════════
         SIDEBAR
    ══════════════════════════════════════════════════════════ -->
    <aside class="sidebar" id="sidebar">

        <!-- Sidebar Header -->
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <span class="sidebar-logo">💬</span>
                <span class="sidebar-app-name">SecureChat</span>
            </div>
            <div class="sidebar-user">
                <div class="user-avatar" id="userAvatar"></div>
                <span class="user-name" id="loggedInUser"></span>
                <button class="btn-icon-only btn-logout-icon" onclick="handleLogout()" title="Logout" aria-label="Logout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Sidebar Tabs -->
        <div class="sidebar-tabs">
            <button class="s-tab active" id="dmTabBtn" onclick="switchSidebarTab('dm')">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                Chats
            </button>
            <button class="s-tab" id="groupTabBtn" onclick="switchSidebarTab('group')">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Groups
            </button>
        </div>

        <!-- DM Panel -->
        <div id="dmPanel" class="s-panel">
            <div class="search-bar">
                <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="receiverInput" class="search-input" placeholder="Find or start a chat…" autocomplete="off">
                <button id="loadChatBtn" class="search-go" title="Open chat" aria-label="Open chat">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
            </div>
            <div class="s-section-label">Recent</div>
            <div id="recentChatsList" class="conv-list">
                <div class="empty-state">
                    <span class="empty-icon">💬</span>
                    <span>No chats yet</span>
                </div>
            </div>
        </div>

        <!-- Groups Panel -->
        <div id="groupPanel" class="s-panel" style="display:none;">
            <button class="btn-new-group" onclick="openCreateGroupModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New Group
            </button>
            <div class="s-section-label">My Groups</div>
            <div id="groupList" class="conv-list">
                <div class="empty-state">
                    <span class="empty-icon">👥</span>
                    <span>No groups yet</span>
                </div>
            </div>
        </div>

    </aside>

    <!-- ══════════════════════════════════════════════════════════
         MAIN CHAT AREA
    ══════════════════════════════════════════════════════════ -->
    <main class="chat-main">

        <!-- Empty state (no conversation selected) -->
        <div class="chat-empty" id="chatEmpty">
            <div class="chat-empty-inner">
                <div class="chat-empty-icon">🌸</div>
                <h2>Welcome to SecureChat</h2>
                <p>Select a conversation or start a new one</p>
                <div class="chat-empty-badges">
                    <span class="badge">🔒 Encrypted</span>
                    <span class="badge">🛡 HMAC Verified</span>
                    <span class="badge">🔑 DH Keys</span>
                </div>
            </div>
        </div>

        <!-- Active conversation -->
        <div class="chat-view" id="chatView" style="display:none;">

            <!-- Chat Header -->
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="chat-avatar" id="chatAvatar"></div>
                    <div class="chat-header-info">
                        <div class="chat-header-name" id="chatHeaderTitle"></div>
                        <div class="chat-header-sub" id="chatHeaderSub"></div>
                    </div>
                </div>
                <div class="chat-header-actions" id="groupActions" style="display:none;">
                    <button class="hdr-btn" onclick="openGroupInfoModal()" title="Members">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        Members
                    </button>
                    <button class="hdr-btn" onclick="openAddMemberModal()" title="Add member">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                        Add
                    </button>
                    <button class="hdr-btn hdr-btn-danger" onclick="leaveGroup()" title="Leave group">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Leave
                    </button>
                </div>
            </div>

            <!-- Messages -->
            <div class="messages-area" id="messagesArea"></div>

            <!-- Image preview strip -->
            <div id="imagePreview" class="img-preview-strip" style="display:none;">
                <img id="previewImg" src="" alt="Preview">
                <div class="img-preview-info" id="imgPreviewName"></div>
                <button id="cancelImage" class="img-preview-cancel" aria-label="Remove image">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <!-- Input Bar -->
            <div class="input-bar">
                <label for="imageInput" class="input-attach" title="Attach image" aria-label="Attach image">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                </label>
                <input type="file" id="imageInput" accept="image/*" style="display:none;" aria-hidden="true">
                <input type="text" id="messageInput" class="input-text" placeholder="Type a message…" disabled autocomplete="off">
                <button id="sendBtn" class="input-send" disabled aria-label="Send message">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>

        </div>
    </main>
</div>

<!-- ══════════════════════════════════════════════════════════
     MODALS
══════════════════════════════════════════════════════════ -->

<!-- Create Group -->
<div id="createGroupModal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="cgTitle">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title-row">
                <span class="modal-icon">👥</span>
                <span id="cgTitle">New Group</span>
            </div>
            <button class="modal-x" onclick="closeModal('createGroupModal')" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="modal-field">
                <label class="modal-label">Group name</label>
                <input type="text" id="newGroupName" class="modal-input" placeholder="e.g. Family, Study Group…" maxlength="100">
            </div>
            <div id="createGroupError" class="modal-err" style="display:none;"></div>
        </div>
        <div class="modal-footer">
            <button class="modal-btn-ghost" onclick="closeModal('createGroupModal')">Cancel</button>
            <button class="modal-btn-primary" onclick="createGroup()">Create Group</button>
        </div>
    </div>
</div>

<!-- Add Member -->
<div id="addMemberModal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="amTitle">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title-row">
                <span class="modal-icon">➕</span>
                <span id="amTitle">Add Member</span>
            </div>
            <button class="modal-x" onclick="closeModal('addMemberModal')" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="modal-field">
                <label class="modal-label">Username</label>
                <input type="text" id="addMemberUsername" class="modal-input" placeholder="Enter their username…">
            </div>
            <div id="addMemberError" class="modal-err" style="display:none;"></div>
        </div>
        <div class="modal-footer">
            <button class="modal-btn-ghost" onclick="closeModal('addMemberModal')">Cancel</button>
            <button class="modal-btn-primary" onclick="addMember()">Add to Group</button>
        </div>
    </div>
</div>

<!-- Group Info / Members -->
<div id="groupInfoModal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="giTitle">
    <div class="modal modal-lg">
        <div class="modal-header">
            <div class="modal-title-row">
                <span class="modal-icon">👥</span>
                <span id="groupInfoTitle">Members</span>
            </div>
            <button class="modal-x" onclick="closeModal('groupInfoModal')" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <div id="membersList" class="members-list"></div>
        </div>
        <div class="modal-footer">
            <button class="modal-btn-ghost" onclick="closeModal('groupInfoModal')">Close</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
